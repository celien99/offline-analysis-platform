apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: industrial-ai
data:
  INDUSTRIAL_ENVIRONMENT: "production"
  INDUSTRIAL_POSTGRES_URL: "postgresql+asyncpg://postgres:$(DB_PASSWORD)@db-service:5432/industrial_ai"
  INDUSTRIAL_REDIS_URL: "redis://redis-service:6379/0"
  INDUSTRIAL_MINIO_ENDPOINT: "minio-service:9000"
  INDUSTRIAL_MINIO_BUCKET: "anomaly-data"
  INDUSTRIAL_CELERY_BROKER_URL: "redis://redis-service:6379/1"
  INDUSTRIAL_CELERY_RESULT_BACKEND: "redis://redis-service:6379/2"
  INDUSTRIAL_MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  INDUSTRIAL_MLFLOW_ARTIFACT_ROOT: "s3://mlflow-artifacts"
  INDUSTRIAL_VLM_ENDPOINT: "http://vllm-service:8001/v1"
  INDUSTRIAL_VLM_MODEL: "qwen2.5-vl"
  INDUSTRIAL_EMBEDDING_DIM: "512"
  INDUSTRIAL_CLUSTERING_MIN_CLUSTER_SIZE: "5"
  INDUSTRIAL_CLUSTERING_MIN_SAMPLES: "3"
  INDUSTRIAL_UMAP_N_COMPONENTS: "2"
  INDUSTRIAL_UMAP_N_NEIGHBORS: "15"
  INDUSTRIAL_MODEL_DIR: "/data/models"
  INDUSTRIAL_LOG_LEVEL: "INFO"
