apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: industrial-ai
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: offline-analysis-platform/worker:latest
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: model-data
              mountPath: /data/models
      volumes:
        - name: model-data
          persistentVolumeClaim:
            claimName: model-data-pvc
