services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INDUSTRIAL_POSTGRES_URL=postgresql+asyncpg://postgres:postgres@db:5432/anomaly_db
      - INDUSTRIAL_REDIS_URL=redis://redis:6379/0
      - INDUSTRIAL_CELERY_BROKER_URL=redis://redis:6379/1
      - INDUSTRIAL_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - INDUSTRIAL_MINIO_ENDPOINT=minio:9000
      - INDUSTRIAL_MINIO_ACCESS_KEY=minioadmin
      - INDUSTRIAL_MINIO_SECRET_KEY=minioadmin
      - INDUSTRIAL_MINIO_BUCKET=anomaly-data
      - INDUSTRIAL_MLFLOW_TRACKING_URI=http://mlflow:5001
      - INDUSTRIAL_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    environment:
      - INDUSTRIAL_POSTGRES_URL=postgresql+asyncpg://postgres:postgres@db:5432/anomaly_db
      - INDUSTRIAL_REDIS_URL=redis://redis:6379/0
      - INDUSTRIAL_CELERY_BROKER_URL=redis://redis:6379/1
      - INDUSTRIAL_CELERY_RESULT_BACKEND=redis://redis:6379/2
      - INDUSTRIAL_MINIO_ENDPOINT=minio:9000
      - INDUSTRIAL_MINIO_ACCESS_KEY=minioadmin
      - INDUSTRIAL_MINIO_SECRET_KEY=minioadmin
      - INDUSTRIAL_MINIO_BUCKET=anomaly-data
      - INDUSTRIAL_MLFLOW_TRACKING_URI=http://mlflow:5001
      - INDUSTRIAL_DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anomaly_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/anomaly-data;
      exit 0
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    ports:
      - "5001:5001"
    command: mlflow server --host 0.0.0.0 --port 5001
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
