[project]
name = "offline-analysis-platform"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "backend",
    "defect_protocol",
    "ml",
    "seat_defect_core",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
